<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>K5Launcher</title>
  <script>
    (function() {
      var userLang = navigator.language || navigator.userLanguage || '';
      if (userLang.toLowerCase().startsWith('uk') || userLang.startsWith('ru')) {
        window.location.replace('./uk/');
      } else {
        window.location.replace('./en/');
      }
    })();
  </script>
</head>

</html>
