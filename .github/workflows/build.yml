name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Application with PyInstaller
        run: pyinstaller --noconfirm --log-level WARN K5Launcher.spec

      - name: Create Portable ZIP
        run: |
          Compress-Archive -Path dist\K5Launcher\* -DestinationPath k5launcher-portable.zip

      - name: Build Installer with Inno Setup
        run: iscc K5Launcher.iss

      - name: Upload Artifacts (For Manual Testing)
        uses: actions/upload-artifact@v4
        with:
          name: k5launcher-builds
          path: |
            k5launcher-portable.zip
            installer_output/k5launcher-setup.exe
          retention-days: 1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: k5launcher ${{ github.ref_name }} 
          generate_release_notes: true
          files: |
            k5launcher-portable.zip
            installer_output/k5launcher-setup.exe