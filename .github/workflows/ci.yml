name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.py'
      - '**.spec'
      - '**.iss'
      - 'tests/**'
      - 'requirements-dev.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.py'
      - '**.spec'
      - '**.iss'
      - 'tests/**'
      - 'requirements-dev.txt'
      - '.github/workflows/**'
  

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: Run Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest
        run: pytest -v --cov=src --cov-report=term-missing

  lint-and-validate:
    name: Code Quality 
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Smoke Test 
        run: |
          python -c "import src.core.launcher; import src.ui.app; print('Modules imported successfully!')"

  build-check:
    name: Build Check
    runs-on: windows-latest
    needs: [run-tests, lint-and-validate]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Build Application
        run: pyinstaller --noconfirm --log-level WARN K5Launcher.spec
