name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Code Quality & Build Check
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff (Linter & Syntax Check)
        run: ruff check .

      - name: Smoke Test (Validate Core & GUI Imports)
        run: |
          python -c "import src.core.launcher; import src.ui.app; print('Modules imported successfully!')"

      - name: Dry-Run PyInstaller Spec Build
        run: pyinstaller --noconfirm --log-level WARN K5Launcher.spec